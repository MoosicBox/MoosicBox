# Build execution for compact nested routing; no separate preparation runner.
name: Build planned jobs

on:
    workflow_call:
        inputs:
            node-id:
                type: string
                required: true
            jobs-json:
                type: string
                required: true

jobs:
    build:
        name: ${{ matrix.job.name }}
        runs-on: ${{ matrix.job.os }}

        strategy:
            fail-fast: false

            matrix:
                job: ${{ fromJson(inputs.jobs-json) }}

        steps:
            - name: Print matrix
              shell: bash
              env:
                  MATRIX_JSON: ${{ toJson(matrix) }}
              run: printf '%s\n' "$MATRIX_JSON"

            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0
                  submodules: ${{ matrix.job.gitSubmodules == true }}

            - uses: actions/download-artifact@v8
              with:
                  name: clippier-case-plan
                  path: ${{ runner.temp }}/clippier-plan

            - name: Validate and resolve planned job
              id: resolve
              shell: bash
              env:
                  PYTHONUTF8: "1"
                  NODE_ID: ${{ inputs.node-id }}
                  JOB_REFERENCE: ${{ toJson(matrix.job) }}
              run: |
                  package=$(python3 .github/actions/clippier/lib/shard_tree.py resolve "$RUNNER_TEMP/clippier-plan/hierarchy" "$NODE_ID" "$JOB_REFERENCE")
                  echo "package=$package" >> "$GITHUB_OUTPUT"

            - name: Enable patches
              if: ${{ github.event.inputs.edge == 'true' }}
              run: |
                  git config user.name "MoosicBoxBot"
                  git config user.email "MoosicBoxBot@gmail.com"
                  git checkout edge
                  git rebase master

            - name: Setup CI environment
              uses: ./.github/actions/clippier
              with:
                  command: setup
                  package-json: ${{ steps.resolve.outputs.package }}
                  skip-checkout: "true"
                  rust-components: "rustfmt, clippy, llvm-tools-preview"

            - name: Install cargo-llvm-cov
              uses: taiki-e/install-action@cargo-llvm-cov

            - name: Download Clippier machete
              uses: actions/download-artifact@v8
              with:
                  name: ${{ matrix.job.os == 'windows-latest' && 'clippier-machete.exe' || matrix.job.os == 'macos-latest' && 'clippier-machete-macos' || 'clippier-machete-ubuntu' }}
                  path: ~/.cargo/bin

            - name: Make Clippier machete executable
              shell: bash
              run: chmod +x ~/.cargo/bin/clippier${{ matrix.job.os == 'windows-latest' && '.exe' || '' }}

            - name: Test suite for ${{ fromJson(steps.resolve.outputs.package).name }}
              id: test-suite
              uses: ./.github/actions/clippier
              env:
                  CARGO_LOG: ${{ runner.debug && 'cargo=debug' || '' }}
              with:
                  command: run-matrix
                  case-coverage: true
                  run-matrix-package-json: ${{ steps.resolve.outputs.package }}
                  run-matrix-steps-file: .github/clippier/run-matrix/rust-validation.yml
                  run-matrix-template-vars: |
                      {"test-command":"llvm-cov test --no-report"}
                  run-matrix-debug-shells: "fish,bash"

            - name: Upload case receipts
              if: always() && steps.test-suite.outputs.case-receipts-path != ''
              uses: actions/upload-artifact@v6
              with:
                  name: clippier-case-receipts-${{ inputs.node-id }}-${{ strategy.job-index }}
                  path: ${{ steps.test-suite.outputs.case-receipts-path }}
                  if-no-files-found: error

            - name: Upload coverage reports to Codecov
              if: always() && steps.test-suite.outputs.coverage-path != ''
              uses: codecov/codecov-action@v6
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  slug: MoosicBox/MoosicBox
                  directory: ${{ steps.test-suite.outputs.coverage-path }}
                  flags: ${{ fromJson(steps.resolve.outputs.package).name }}
                  fail_ci_if_error: false

