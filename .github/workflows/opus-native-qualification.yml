name: Opus native strict platform qualification

on:
    workflow_dispatch:
        inputs:
            music_wav_url:
                description: "Reviewed public HTTPS URL of exact music-carefree-30s.wav bytes (manifest SHA-256 enforced; not source MP3)"
                required: false
                type: string
    pull_request:
        paths:
            - "packages/opus_native/**"
            - ".github/workflows/opus-native-qualification.yml"
            - "Cargo.toml"
            - "Cargo.lock"
    push:
        branches: [master]
        paths:
            - "packages/opus_native/**"
            - ".github/workflows/opus-native-qualification.yml"
            - "Cargo.toml"
            - "Cargo.lock"

permissions:
    contents: read

concurrency:
    group: opus-native-strict-${{ github.ref }}
    cancel-in-progress: true

env:
    CARGO_BUILD_JOBS: "2"
    CARGO_TERM_COLOR: never
    CMAKE_GENERATOR: Ninja
    # Do not let platform line-ending conversion create different source images.
    GIT_CONFIG_COUNT: "1"
    GIT_CONFIG_KEY_0: core.autocrlf
    GIT_CONFIG_VALUE_0: "false"

jobs:
    native:
        name: Offline native ${{ matrix.platform.id }} ${{ matrix.profile }}
        runs-on: ${{ matrix.platform.runner }}
        timeout-minutes: 60
        strategy:
            fail-fast: false
            matrix:
                platform:
                    - {id: linux-x64, runner: ubuntu-24.04}
                    - {id: linux-arm64, runner: ubuntu-24.04-arm}
                    - {id: macos-x64, runner: macos-15-intel}
                    - {id: windows-x64, runner: windows-2025}
                profile: [debug, release]
        steps:
            - uses: actions/checkout@v6
              with:
                  submodules: false
            - uses: dtolnay/rust-toolchain@1.99.0
            - uses: actions/setup-python@v6
              with:
                  python-version: "3.13"
            - name: Provision locked dependencies and pinned range-test oracle (network only here)
              shell: bash
              run: |
                  git submodule update --init --depth 1 -- packages/opus_native/libopus/opus
                  test "$(git -C packages/opus_native/libopus/opus rev-parse HEAD)" = 34bba701ae97c913de719b1f7c10686f62cddb15
                  cargo fetch --locked
            - name: Provision player test decoder
              shell: bash
              run: |
                  if ! command -v ffmpeg >/dev/null; then
                    case "$RUNNER_OS" in
                      Linux) sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg ;;
                      macOS) brew install ffmpeg ;;
                      Windows) choco install ffmpeg -y --no-progress ;;
                      *) exit 1 ;;
                    esac
                  fi
                  ffmpeg -version
            - name: Offline native tests and repeated immutable fingerprint probe
              shell: bash
              run: |
                  python -B packages/opus_native/test_runner/src/qualification_ci.py run \
                    --mode native --platform '${{ matrix.platform.id }}' --profile '${{ matrix.profile }}' \
                    --output "$RUNNER_TEMP/opus-native-${{ matrix.platform.id }}-${{ matrix.profile }}"
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: opus-platform-native-${{ matrix.platform.id }}-${{ matrix.profile }}
                  path: |
                      ${{ runner.temp }}/opus-native-${{ matrix.platform.id }}-${{ matrix.profile }}/
                      !${{ runner.temp }}/opus-native-${{ matrix.platform.id }}-${{ matrix.profile }}/target/**
                      !${{ runner.temp }}/opus-native-${{ matrix.platform.id }}-${{ matrix.profile }}/repeat/**
                  if-no-files-found: error
                  retention-days: 14

    quality:
        name: Strict frozen-C and reviewed media ${{ matrix.platform.id }} ${{ matrix.shard }}
        runs-on: ${{ matrix.platform.runner }}
        timeout-minutes: 90
        strategy:
            fail-fast: false
            matrix:
                shard: [core, live-0, live-1, live-2, live-3, live-4, live-5, live-6, live-7, live-8, public-0, public-1, public-2, public-3, public-4, public-5, public-6, public-7, public-8, public-9, public-10, public-11, public-12, public-13, public-14, public-15, public-16, public-17, public-18, public-19, public-20, public-21, public-22, public-23, floor-0, floor-1, floor-2, floor-3, floor-4, floor-5, floor-6, floor-7, floor-8, floor-9, floor-10, floor-11, floor-12, floor-13, floor-14, floor-15, floor-16, floor-17, floor-18, floor-19, floor-20, floor-21, floor-22, floor-23, floor-24, floor-25, floor-26, floor-27]
                platform:
                    - {id: linux-x64, runner: ubuntu-24.04}
                    - {id: linux-arm64, runner: ubuntu-24.04-arm}
                    - {id: macos-x64, runner: macos-15-intel}
                    - {id: windows-x64, runner: windows-2025}
        steps:
            - uses: actions/checkout@v6
              with:
                  submodules: false
            - name: Fail closed when reviewed derived music WAV URL is missing
              env:
                  MUSIC_WAV_URL: ${{ inputs.music_wav_url || vars.OPUS_REVIEWED_MUSIC_WAV_URL || format('https://raw.githubusercontent.com/{0}/{1}/packages/opus_native/test_runner/fixtures/music-carefree-30s.wav', github.repository, github.sha) }}
              shell: bash
              run: |
                  if [[ -z "$MUSIC_WAV_URL" ]]; then
                    echo 'Missing reviewed WAV URL: configure OPUS_REVIEWED_MUSIC_WAV_URL or explicit dispatch input; strict qualification cannot skip media.' >&2
                    exit 1
                  fi
            - uses: dtolnay/rust-toolchain@1.99.0
            - uses: actions/setup-python@v6
              with:
                  python-version: "3.13"
            - uses: ilammy/msvc-dev-cmd@v1
              if: runner.os == 'Windows'
            - name: Initialize only pinned test-only C reference source
              shell: bash
              run: |
                  git submodule update --init --depth 1 -- packages/opus_native/libopus/opus
                  test "$(git -C packages/opus_native/libopus/opus rev-parse HEAD)" = 34bba701ae97c913de719b1f7c10686f62cddb15
                  cmake --version
                  ninja --version
            - name: Explicit locked dependency provisioning (network only here)
              run: cargo fetch --locked
            - name: Explicit fixed-point oracle, frozen expectations and strict media qualification
              env:
                  MUSIC_WAV_URL: ${{ inputs.music_wav_url || vars.OPUS_REVIEWED_MUSIC_WAV_URL || format('https://raw.githubusercontent.com/{0}/{1}/packages/opus_native/test_runner/fixtures/music-carefree-30s.wav', github.repository, github.sha) }}
              shell: bash
              run: |
                  python -B packages/opus_native/test_runner/src/qualification_ci.py run \
                    --mode quality --platform '${{ matrix.platform.id }}' --profile release \
                    --quality-shard '${{ matrix.shard }}' \
                    --music-wav-url "$MUSIC_WAV_URL" \
                    --output "$RUNNER_TEMP/opus-quality-${{ matrix.platform.id }}-${{ matrix.shard }}"
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: opus-platform-quality-${{ matrix.platform.id }}-${{ matrix.shard }}
                  path: |
                      ${{ runner.temp }}/opus-quality-${{ matrix.platform.id }}-${{ matrix.shard }}/
                      !${{ runner.temp }}/opus-quality-${{ matrix.platform.id }}-${{ matrix.shard }}/target/**
                      !${{ runner.temp }}/opus-quality-${{ matrix.platform.id }}-${{ matrix.shard }}/media/**
                  if-no-files-found: error
                  retention-days: 14

    layout:
        name: Required layout cell ${{ matrix.platform.id }} ${{ matrix.shard }}
        runs-on: ${{ matrix.platform.runner }}
        timeout-minutes: 90
        strategy:
            fail-fast: false
            matrix:
                shard: [layout-0, layout-1, layout-2, layout-3, layout-4, layout-5, layout-6, layout-7, layout-8, layout-9, layout-10, layout-11, layout-12, layout-13, layout-14, layout-15, layout-16, layout-17, layout-18, layout-19, layout-20, layout-21, layout-22, layout-23, layout-24, layout-25, layout-26, layout-27, layout-28, layout-29, layout-30, layout-31, layout-32, layout-33, layout-34, layout-35, layout-36, layout-37, layout-38, layout-39, floor-28, floor-29, floor-30, floor-31, floor-32, floor-33, floor-34, floor-35, floor-36, floor-37, floor-38, floor-39, floor-40, floor-41, floor-42, floor-43, floor-44, floor-45, floor-46, floor-47, floor-48, floor-49, floor-50]
                platform:
                    - {id: linux-x64, runner: ubuntu-24.04}
                    - {id: linux-arm64, runner: ubuntu-24.04-arm}
                    - {id: macos-x64, runner: macos-15-intel}
                    - {id: windows-x64, runner: windows-2025}
        steps:
            - uses: actions/checkout@v6
              with:
                  submodules: false
            - name: Fail closed when reviewed derived music WAV URL is missing
              env:
                  MUSIC_WAV_URL: ${{ inputs.music_wav_url || vars.OPUS_REVIEWED_MUSIC_WAV_URL || format('https://raw.githubusercontent.com/{0}/{1}/packages/opus_native/test_runner/fixtures/music-carefree-30s.wav', github.repository, github.sha) }}
              shell: bash
              run: |
                  if [[ -z "$MUSIC_WAV_URL" ]]; then
                    echo 'Missing reviewed WAV URL: configure OPUS_REVIEWED_MUSIC_WAV_URL or explicit dispatch input; strict qualification cannot skip media.' >&2
                    exit 1
                  fi
            - uses: dtolnay/rust-toolchain@1.99.0
            - uses: actions/setup-python@v6
              with:
                  python-version: "3.13"
            - uses: ilammy/msvc-dev-cmd@v1
              if: runner.os == 'Windows'
            - name: Initialize only pinned test-only C reference source
              shell: bash
              run: |
                  git submodule update --init --depth 1 -- packages/opus_native/libopus/opus
                  test "$(git -C packages/opus_native/libopus/opus rev-parse HEAD)" = 34bba701ae97c913de719b1f7c10686f62cddb15
                  cmake --version
                  ninja --version
            - name: Explicit locked dependency provisioning (network only here)
              run: cargo fetch --locked
            - name: Explicit fixed-point oracle, frozen expectations and strict media qualification
              env:
                  MUSIC_WAV_URL: ${{ inputs.music_wav_url || vars.OPUS_REVIEWED_MUSIC_WAV_URL || format('https://raw.githubusercontent.com/{0}/{1}/packages/opus_native/test_runner/fixtures/music-carefree-30s.wav', github.repository, github.sha) }}
              shell: bash
              run: |
                  python -B packages/opus_native/test_runner/src/qualification_ci.py run \
                    --mode quality --platform '${{ matrix.platform.id }}' --profile release \
                    --quality-shard '${{ matrix.shard }}' \
                    --music-wav-url "$MUSIC_WAV_URL" \
                    --output "$RUNNER_TEMP/opus-quality-${{ matrix.platform.id }}-${{ matrix.shard }}"
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: opus-platform-quality-${{ matrix.platform.id }}-${{ matrix.shard }}
                  path: |
                      ${{ runner.temp }}/opus-quality-${{ matrix.platform.id }}-${{ matrix.shard }}/
                      !${{ runner.temp }}/opus-quality-${{ matrix.platform.id }}-${{ matrix.shard }}/target/**
                      !${{ runner.temp }}/opus-quality-${{ matrix.platform.id }}-${{ matrix.shard }}/media/**
                  if-no-files-found: error
                  retention-days: 14

    hybrid:
        name: Required public hybrid Auto cells ${{ matrix.platform.id }} ${{ matrix.shard }}
        runs-on: ${{ matrix.platform.runner }}
        timeout-minutes: 90
        strategy:
            fail-fast: false
            matrix:
                shard: [hybrid-0, hybrid-1, hybrid-2, hybrid-3, hybrid-4, hybrid-5, hybrid-6, hybrid-7, hybrid-8, hybrid-9, hybrid-10, hybrid-11, hybrid-12, hybrid-13, hybrid-14, hybrid-15, hybrid-16, hybrid-17, hybrid-18, hybrid-19, hybrid-20, hybrid-21, hybrid-22, hybrid-23, hybrid-24, hybrid-25, hybrid-26, hybrid-27, hybrid-28, hybrid-29, hybrid-30, hybrid-31, hybrid-32, hybrid-33, hybrid-34, hybrid-35, hybrid-36, hybrid-37, hybrid-38, hybrid-39, hybrid-40, hybrid-41, hybrid-42, hybrid-43, hybrid-44, hybrid-45, hybrid-46, hybrid-47, floor-51, floor-52, floor-53, floor-54, floor-55, floor-56, floor-57, floor-58, floor-59, floor-60, floor-61, floor-62, floor-63, floor-64, floor-65, floor-66]
                platform:
                    - {id: linux-x64, runner: ubuntu-24.04}
                    - {id: linux-arm64, runner: ubuntu-24.04-arm}
                    - {id: macos-x64, runner: macos-15-intel}
                    - {id: windows-x64, runner: windows-2025}
        steps:
            - uses: actions/checkout@v6
              with:
                  submodules: false
            - name: Fail closed when reviewed derived music WAV URL is missing
              env:
                  MUSIC_WAV_URL: ${{ inputs.music_wav_url || vars.OPUS_REVIEWED_MUSIC_WAV_URL || format('https://raw.githubusercontent.com/{0}/{1}/packages/opus_native/test_runner/fixtures/music-carefree-30s.wav', github.repository, github.sha) }}
              shell: bash
              run: |
                  if [[ -z "$MUSIC_WAV_URL" ]]; then
                    echo 'Missing reviewed WAV URL: configure OPUS_REVIEWED_MUSIC_WAV_URL or explicit dispatch input; strict qualification cannot skip media.' >&2
                    exit 1
                  fi
            - uses: dtolnay/rust-toolchain@1.99.0
            - uses: actions/setup-python@v6
              with:
                  python-version: "3.13"
            - uses: ilammy/msvc-dev-cmd@v1
              if: runner.os == 'Windows'
            - name: Initialize only pinned test-only C reference source
              shell: bash
              run: |
                  git submodule update --init --depth 1 -- packages/opus_native/libopus/opus
                  test "$(git -C packages/opus_native/libopus/opus rev-parse HEAD)" = 34bba701ae97c913de719b1f7c10686f62cddb15
                  cmake --version
                  ninja --version
            - name: Explicit locked dependency provisioning (network only here)
              run: cargo fetch --locked
            - name: Explicit fixed-point oracle, frozen expectations and strict media qualification
              env:
                  MUSIC_WAV_URL: ${{ inputs.music_wav_url || vars.OPUS_REVIEWED_MUSIC_WAV_URL || format('https://raw.githubusercontent.com/{0}/{1}/packages/opus_native/test_runner/fixtures/music-carefree-30s.wav', github.repository, github.sha) }}
              shell: bash
              run: |
                  python -B packages/opus_native/test_runner/src/qualification_ci.py run \
                    --mode quality --platform '${{ matrix.platform.id }}' --profile release \
                    --quality-shard '${{ matrix.shard }}' \
                    --music-wav-url "$MUSIC_WAV_URL" \
                    --output "$RUNNER_TEMP/opus-quality-${{ matrix.platform.id }}-${{ matrix.shard }}"
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: opus-platform-quality-${{ matrix.platform.id }}-${{ matrix.shard }}
                  path: |
                      ${{ runner.temp }}/opus-quality-${{ matrix.platform.id }}-${{ matrix.shard }}/
                      !${{ runner.temp }}/opus-quality-${{ matrix.platform.id }}-${{ matrix.shard }}/target/**
                      !${{ runner.temp }}/opus-quality-${{ matrix.platform.id }}-${{ matrix.shard }}/media/**
                  if-no-files-found: error
                  retention-days: 14

    compare:
        name: Require every actual platform and exact native fingerprints
        needs: [native, quality, layout, hybrid]
        # Report failed shards, but release the concurrency group on cancellation.
        if: ${{ !cancelled() }}
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-python@v6
              with:
                  python-version: "3.13"
            - uses: actions/download-artifact@v4
              with:
                  pattern: opus-platform-*
                  path: platform-evidence
                  merge-multiple: false
            - name: Verify all 764 executions, retained bytes and exact debug/release/platform agreement
              shell: bash
              env:
                  NATIVE_RESULT: ${{ needs.native.result }}
                  QUALITY_RESULT: ${{ needs.quality.result }}
                  LAYOUT_RESULT: ${{ needs.layout.result }}
                  HYBRID_RESULT: ${{ needs.hybrid.result }}
              run: |
                  set -euo pipefail
                  if [[ "$NATIVE_RESULT" != success || "$QUALITY_RESULT" != success || "$LAYOUT_RESULT" != success || "$HYBRID_RESULT" != success ]]; then
                    echo 'A required real-execution job failed/cancelled/skipped; qualification is NOT accepted.' >&2
                    exit 1
                  fi
                  python -B packages/opus_native/test_runner/src/qualification_ci.py compare platform-evidence | tee comparison.txt
                  cat comparison.txt >> "$GITHUB_STEP_SUMMARY"
            - uses: actions/upload-artifact@v4
              with:
                  name: opus-platform-exact-comparison
                  path: |
                      comparison.txt
                      platform-evidence/platform-acceptance.json
                  if-no-files-found: error
