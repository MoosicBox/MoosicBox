name: Bloaty

on:
    workflow_dispatch:
    push:
        branches: ["master"]
        paths:
            - "packages/**"
            - "Cargo.toml"
            - "Cargo.lock"
            - ".github/workflows/bloaty.yml"
    pull_request:
        paths:
            - "packages/**"
            - "Cargo.toml"
            - "Cargo.lock"
            - ".github/workflows/bloaty.yml"

permissions:
    actions: read
    contents: read

env:
    CARGO_TERM_COLOR: always

jobs:
    analyze:
        name: Analyze ${{ matrix.package }} (${{ matrix.profile }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - package: moosicbox_aconverter
                      target: aconverter
                      profile: release
                      baseline: none
                      feature: flac
                      scenario: audio=flac,mp3
        steps:
            - uses: actions/checkout@v6

            - uses: dtolnay/rust-toolchain@stable

            - uses: Swatinem/rust-cache@v2
              with:
                  key: bloaty-${{ matrix.package }}-${{ matrix.profile }}

            - name: Analyze final artifact
              run: |
                  cargo run --package bloaty -- \
                    --package "${{ matrix.package }}" \
                    --target "${{ matrix.target }}" \
                    --profile "${{ matrix.profile }}" \
                    --baseline "${{ matrix.baseline }}" \
                    --feature "${{ matrix.feature }}" \
                    --scenario "${{ matrix.scenario }}" \
                    --output-format all \
                    --report-file "bloaty-${{ matrix.package }}-${{ matrix.profile }}"

            - name: Download latest master baseline
              if: github.event_name == 'pull_request'
              id: baseline
              continue-on-error: true
              env:
                  GH_TOKEN: ${{ github.token }}
                  ARTIFACT_NAME: bloaty-${{ matrix.package }}-${{ matrix.profile }}-${{ runner.os }}
              run: |
                  run_id="$(gh run list \
                    --workflow Bloaty \
                    --branch master \
                    --status success \
                    --limit 1 \
                    --json databaseId \
                    --jq '.[0].databaseId')"
                  test -n "$run_id"
                  mkdir baseline
                  gh run download "$run_id" --name "$ARTIFACT_NAME" --dir baseline
                  echo "available=true" >> "$GITHUB_OUTPUT"

            - name: Compare with latest master baseline (advisory)
              if: github.event_name == 'pull_request' && steps.baseline.outputs.available == 'true'
              continue-on-error: true
              run: |
                  cargo run --package bloaty -- \
                    --compare-reports \
                    "baseline/bloaty-${{ matrix.package }}-${{ matrix.profile }}.json" \
                    "bloaty-${{ matrix.package }}-${{ matrix.profile }}.json"

            - name: Explain missing baseline
              if: github.event_name == 'pull_request' && steps.baseline.outputs.available != 'true'
              run: echo "No compatible successful master baseline artifact is available yet; comparison is advisory."

            - name: Upload reports
              if: always()
              uses: actions/upload-artifact@v6
              with:
                  name: bloaty-${{ matrix.package }}-${{ matrix.profile }}-${{ runner.os }}
                  path: bloaty-${{ matrix.package }}-${{ matrix.profile }}.*
                  if-no-files-found: error
                  retention-days: 90
