name: Bloaty

on:
    workflow_dispatch:
    push:
        branches: [master]
        paths: ["packages/**", "Cargo.toml", "Cargo.lock", ".github/actions/clippier/**", ".github/clippier/run-matrix/bloaty.yml", ".github/workflows/bloaty.yml"]
    pull_request:
        paths: ["packages/**", "Cargo.toml", "Cargo.lock", ".github/actions/clippier/**", ".github/clippier/run-matrix/bloaty.yml", ".github/workflows/bloaty.yml"]

permissions:
    actions: read
    contents: read

concurrency:
    group: bloaty-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
    CARGO_TERM_COLOR: always
    CARGO_INCREMENTAL: "0"
    CARGO_BUILD_JOBS: "2"
    RUSTFLAGS: ""

jobs:
    plan:
        runs-on: ubuntu-24.04
        outputs:
            matrix: ${{ steps.packages.outputs.matrix }}
        steps:
            - uses: actions/checkout@v6
            - name: Discover analysis packages
              id: packages
              uses: ./.github/actions/clippier
              with:
                  command: features
                  # Default is measured as its own configuration, not added to the baseline.
                  # ASIO is Windows-only; the others are non-product/internal features.
                  skip-features: "default,fail-on-warnings,_*,asio"
                  chunked: "1000"
                  packages: moosicbox_aconverter,moosicbox_server,moosicbox_tunnel_server
                  os: ubuntu
                  os-suffix: "-latest"
                  skip-on-no-changes: "false"
                  force-full-matrix-condition: "true"

    analyze:
        needs: plan
        name: Size ${{ matrix.package.name }}
        runs-on: ubuntu-24.04
        timeout-minutes: 90
        strategy:
            fail-fast: false
            max-parallel: 2
            matrix:
                package: ${{ fromJson(needs.plan.outputs.matrix) }}
        steps:
            - uses: actions/checkout@v6
              with:
                  submodules: ${{ matrix.package.gitSubmodules == true }}
            - name: Setup CI environment
              uses: ./.github/actions/clippier
              with:
                  command: setup
                  package-json: ${{ toJson(matrix.package) }}
                  skip-checkout: "true"
            # Override the setup default so measurements use a fixed compiler.
            - uses: dtolnay/rust-toolchain@master
              with:
                  toolchain: "1.95.0"
            - name: Analyze final artifacts
              uses: ./.github/actions/clippier
              with:
                  command: run-matrix
                  run-matrix-package-json: ${{ toJson(matrix.package) }}
                  run-matrix-working-directory: .
                  run-matrix-steps-file: .github/clippier/run-matrix/bloaty.yml
                  run-matrix-stream-output: "true"
                  run-matrix-template-vars: >-
                      {"baseline":"${{ matrix.package.name == 'moosicbox_aconverter' && 'none' || matrix.package.name == 'moosicbox_server' && 'sqlite-sqlx' || 'postgres-raw' }}"}
            - name: Download master baseline
              if: github.event_name == 'pull_request'
              id: baseline
              env:
                  GH_TOKEN: ${{ github.token }}
                  ARTIFACT: bloaty-v3-${{ matrix.package.name }}-release-ubuntu-24.04-rust-1.95.0
              run: |
                  mkdir -p baseline
                  gh run list --workflow bloaty.yml --branch master --status success --limit 30 --json databaseId --jq '.[].databaseId' > baseline-runs.txt
                  while read -r run_id; do
                    if gh run download "$run_id" --name "$ARTIFACT" --dir baseline; then
                      echo 'available=true' >> "$GITHUB_OUTPUT"
                      echo "Baseline: master run $run_id." >> "$GITHUB_STEP_SUMMARY"
                      exit 0
                    fi
                  done < baseline-runs.txt
                  echo 'No retained matching master baseline found. Historical comparison skipped.' >> "$GITHUB_STEP_SUMMARY"
            - name: Compare with master (advisory)
              if: github.event_name == 'pull_request' && steps.baseline.outputs.available == 'true'
              run: |
                  echo '## Historical comparison (advisory)' >> "$GITHUB_STEP_SUMMARY"
                  echo '```text' >> "$GITHUB_STEP_SUMMARY"
                  status=0
                  cargo run --locked --package bloaty -- --compare-reports baseline/report.json report.json > comparison.txt 2>&1 || status=$?
                  cat comparison.txt | tee -a "$GITHUB_STEP_SUMMARY"
                  echo '```' >> "$GITHUB_STEP_SUMMARY"
                  if test "$status" -ne 0; then
                    echo 'Comparison unavailable or incompatible; see diagnostics. No regression threshold enforced.' >> "$GITHUB_STEP_SUMMARY"
                  fi
            - name: Explain comparison scope
              if: github.event_name != 'pull_request'
              run: echo 'Historical comparison runs on PRs only. This run compares feature configurations.' >> "$GITHUB_STEP_SUMMARY"
            - name: Upload reports
              if: always()
              uses: actions/upload-artifact@v6
              with:
                  name: bloaty-v3-${{ matrix.package.name }}-release-ubuntu-24.04-rust-1.95.0
                  path: report.*
                  if-no-files-found: error
                  retention-days: 90

    clippier-report:
        if: always()
        needs: [analyze]
        uses: ./.github/workflows/clippier-report.yml
