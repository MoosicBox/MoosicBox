name: Bloaty

on:
    workflow_dispatch:
    push:
        branches: [master]
        paths: ["packages/**", "Cargo.toml", "Cargo.lock", ".github/actions/clippier/**", ".github/clippier/run-matrix/bloaty.yml", ".github/workflows/bloaty.yml"]
    pull_request:
        paths: ["packages/**", "Cargo.toml", "Cargo.lock", ".github/actions/clippier/**", ".github/clippier/run-matrix/bloaty.yml", ".github/workflows/bloaty.yml"]

permissions:
    actions: read
    contents: read

concurrency:
    group: bloaty-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
    CARGO_TERM_COLOR: always
    CARGO_INCREMENTAL: "0"
    CARGO_BUILD_JOBS: "2"
    RUSTFLAGS: ""

jobs:
    plan:
        runs-on: ubuntu-24.04
        outputs:
            matrix: ${{ steps.shards.outputs.matrix }}
            packages: ${{ steps.shards.outputs.packages }}
        steps:
            - uses: actions/checkout@v6
            - name: Discover analysis packages
              id: packages
              uses: ./.github/actions/clippier
              with:
                  command: features
                  # Default is measured as its own configuration, not added to the baseline.
                  # ASIO is Windows-only; the others are non-product/internal features.
                  skip-features: "default,fail-on-warnings,_*,asio"
                  chunked: "8"
                  # Provision default-build dependencies in every isolated shard, including
                  # baseline prerequisites and the first shard's shipping scenario.
                  # Bloaty does not consume Clippier's Cargo feature flags.
                  required-features: default
                  packages: moosicbox_aconverter,moosicbox_server,moosicbox_tunnel_server
                  os: ubuntu
                  os-suffix: "-latest"
                  skip-on-no-changes: "false"
                  force-full-matrix-condition: "true"
            - name: Identify shards and retain expected coverage
              id: shards
              env:
                  MATRIX: ${{ steps.packages.outputs.matrix }}
              run: |
                  echo "$MATRIX" | jq 'to_entries | map(.value + {shard: .key}) | group_by(.name) | map(length as $count | to_entries | map(.value + {shipping: (.key == 0), shardCount: $count})) | flatten' > plan.json
                  echo "matrix=$(jq -c . plan.json)" >> "$GITHUB_OUTPUT"
                  echo "packages=$(jq -c '[.[] | select(.shardCount > 1) | .name] | unique' plan.json)" >> "$GITHUB_OUTPUT"
            - uses: actions/upload-artifact@v6
              with:
                  name: bloaty-plan
                  path: plan.json

    analyze:
        needs: plan
        name: Size ${{ matrix.package.name }} shard ${{ matrix.package.shard }}
        runs-on: ubuntu-24.04
        timeout-minutes: 90
        strategy:
            fail-fast: false
            max-parallel: 4
            matrix:
                package: ${{ fromJson(needs.plan.outputs.matrix) }}
        steps:
            - uses: actions/checkout@v6
              with:
                  submodules: ${{ matrix.package.gitSubmodules == true }}
            - name: Setup CI environment
              uses: ./.github/actions/clippier
              with:
                  command: setup
                  package-json: ${{ toJson(matrix.package) }}
                  skip-checkout: "true"
            # Override the setup default so measurements use a fixed compiler.
            - uses: dtolnay/rust-toolchain@master
              with:
                  toolchain: "1.95.0"
            - name: Analyze final artifacts
              uses: ./.github/actions/clippier
              with:
                  command: run-matrix
                  run-matrix-package-json: ${{ toJson(matrix.package) }}
                  run-matrix-working-directory: .
                  run-matrix-steps-file: .github/clippier/run-matrix/bloaty.yml
                  run-matrix-stream-output: "true"
                  run-matrix-reporting: "off"
                  run-matrix-template-vars: >-
                      {"baseline":"${{ matrix.package.name == 'moosicbox_tunnel_server' && 'postgres-raw' || 'none' }}", "shipping":"${{ matrix.package.shipping && '--scenario shipping=default' || '' }}", "summary":"${{ matrix.package.shardCount == 1 && '--github-summary' || '' }}"}
            - name: Publish single-shard package report
              if: always() && matrix.package.shardCount == 1
              uses: ./.github/actions/bloaty-report
              with:
                  package: ${{ matrix.package.name }}
            - name: Upload shard reports
              if: always() && matrix.package.shardCount > 1
              uses: actions/upload-artifact@v6
              with:
                  name: bloaty-shard-${{ matrix.package.name }}-${{ matrix.package.shard }}
                  path: report.*
                  if-no-files-found: error
                  retention-days: 90

    merge:
        needs: [plan, analyze]
        if: always() && needs.plan.result == 'success' && needs.plan.outputs.packages != '[]'
        runs-on: ubuntu-24.04
        strategy:
            fail-fast: false
            matrix:
                package: ${{ fromJson(needs.plan.outputs.packages) }}
        steps:
            - uses: actions/checkout@v6
            - uses: dtolnay/rust-toolchain@master
              with:
                  toolchain: "1.95.0"
            - uses: actions/download-artifact@v8
              with:
                  name: bloaty-plan
                  path: plan
            - uses: actions/download-artifact@v8
              with:
                  pattern: bloaty-shard-${{ matrix.package }}-*
                  path: shards
            - name: Merge and publish package report
              env:
                  PACKAGE: ${{ matrix.package }}
              run: |
                  expected=$(jq -r --arg p "$PACKAGE" '[.[] | select(.name == $p) | .features[]] + ["shipping"] | unique | join(",")' plan/plan.json)
                  status=0
                  mapfile -t reports < <(find shards -type f -name report.json | sort)
                  cargo run --locked --package bloaty -- --merge-reports "${reports[@]}" --expected-scenarios "$expected" --output-format all --report-file report --github-summary --fail-on-incomplete > merge.log 2>&1 || status=$?
                  cat merge.log
                  if test "$status" -ne 0; then
                    echo '## Incomplete package analysis' >> "$GITHUB_STEP_SUMMARY"
                    echo 'Shard merging or measurement failed. See merge diagnostics and retained shard artifacts; no complete baseline will be published.' >> "$GITHUB_STEP_SUMMARY"
                    exit "$status"
                  fi
            - name: Publish consolidated report
              if: always()
              uses: ./.github/actions/bloaty-report
              with:
                  package: ${{ matrix.package }}
