name: Build matrix shard

on:
    workflow_call:
        inputs:
            shard-id:
                type: number
                required: false
                default: -1
            node-id:
                type: string
                required: false
                default: ""

jobs:
    prepare:
        runs-on: ubuntu-latest
        outputs:
            matrix: ${{ steps.matrix.outputs.value }}
        steps:
            - uses: actions/checkout@v6
            - uses: actions/download-artifact@v8
              with:
                  name: clippier-case-plan
                  path: plan
            - name: Read bounded matrix shard
              id: matrix
              shell: bash
              env:
                  SHARD_ID: ${{ inputs.shard-id }}
                  NODE_ID: ${{ inputs.node-id }}
              run: |
                  if [[ -n "$NODE_ID" ]]; then
                      matrix=$(python3 .github/actions/clippier/lib/shard_tree.py read plan/hierarchy "$NODE_ID" leaf)
                  else
                      [[ "$SHARD_ID" =~ ^[0-9]+$ ]] || { echo 'Invalid shard ID' >&2; exit 1; }
                      matrix=$(jq -ce 'if type == "array" and length > 0 and length <= 256 then . else error("Invalid matrix shard") end' "plan/shards/$SHARD_ID.json")
                  fi
                  printf '%s' "$matrix" > "$RUNNER_TEMP/clippier-shard-matrix.json"
                  python3 - <<'PYOUTPUT'
                  import os, sys
                  from pathlib import Path
                  sys.path.insert(0, '.github/actions/clippier/lib')
                  from output_budget import validate_outputs
                  value = (Path(os.environ['RUNNER_TEMP']) / 'clippier-shard-matrix.json').read_text()
                  print(f"Matrix output: {validate_outputs({'matrix': value})} UTF-16 bytes")
                  PYOUTPUT
                  echo "value=$matrix" >> "$GITHUB_OUTPUT"

    build:
        name: ${{ matrix.package.name }}${{ matrix.package.hasMultipleOs && format(' {0}', matrix.package.osEmoji) || '' }}${{ matrix.package.osCount > 1 && format(' {0}', matrix.package.osIndex) || '' }}${{ matrix.package.stackSuffix }}
        runs-on: ${{ matrix.package.os }}

        needs: prepare

        strategy:
            fail-fast: false

            matrix:
                package: ${{ fromJson(needs.prepare.outputs.matrix) }}

        steps:
            - name: Print matrix
              shell: bash
              run: echo '${{ toJson(matrix) }}'

            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0
                  submodules: ${{ matrix.package.gitSubmodules == true }}

            - name: Enable patches
              if: ${{ github.event.inputs.edge == 'true' }}
              run: |
                  git config user.name "MoosicBoxBot"
                  git config user.email "MoosicBoxBot@gmail.com"
                  git checkout edge
                  git rebase master

            - name: Setup CI environment
              uses: ./.github/actions/clippier
              with:
                  command: setup
                  package-json: ${{ toJson(matrix.package) }}
                  skip-checkout: "true"
                  rust-components: "rustfmt, clippy, llvm-tools-preview"

            - name: Install cargo-llvm-cov
              uses: taiki-e/install-action@cargo-llvm-cov

            - name: Download Clippier machete
              uses: actions/download-artifact@v8
              with:
                  name: ${{ matrix.package.os == 'windows-latest' && 'clippier-machete.exe' || matrix.package.os == 'macos-latest' && 'clippier-machete-macos' || 'clippier-machete-ubuntu' }}
                  path: ~/.cargo/bin

            - name: Make Clippier machete executable
              shell: bash
              run: chmod +x ~/.cargo/bin/clippier${{ matrix.package.os == 'windows-latest' && '.exe' || '' }}

            - name: Test suite for ${{ matrix.package.name }}
              id: test-suite
              uses: ./.github/actions/clippier
              env:
                  CARGO_LOG: ${{ runner.debug && 'cargo=debug' || '' }}
              with:
                  command: run-matrix
                  case-coverage: true
                  run-matrix-package-json: ${{ toJson(matrix.package) }}
                  run-matrix-steps-file: .github/clippier/run-matrix/rust-validation.yml
                  run-matrix-template-vars: |
                      {"test-command":"llvm-cov test --no-report"}
                  run-matrix-debug-shells: "fish,bash"

            - name: Upload case receipts
              if: always() && steps.test-suite.outputs.case-receipts-path != ''
              uses: actions/upload-artifact@v6
              with:
                  name: clippier-case-receipts-${{ inputs.node-id != '' && inputs.node-id || inputs.shard-id }}-${{ strategy.job-index }}
                  path: ${{ steps.test-suite.outputs.case-receipts-path }}
                  if-no-files-found: error

            - name: Upload coverage reports to Codecov
              if: always() && steps.test-suite.outputs.coverage-path != ''
              uses: codecov/codecov-action@v6
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  slug: MoosicBox/MoosicBox
                  directory: ${{ steps.test-suite.outputs.coverage-path }}
                  flags: ${{ matrix.package.name }}
                  fail_ci_if_error: false

