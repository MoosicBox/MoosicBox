name: Filesystem directories

on:
    pull_request:
        paths:
            - "packages/switchy/fs/**"
            - "Cargo.toml"
            - "Cargo.lock"
            - ".github/workflows/fs-directories.yml"
    push:
        branches: [master]
        paths:
            - "packages/switchy/fs/**"
            - "Cargo.toml"
            - "Cargo.lock"
            - ".github/workflows/fs-directories.yml"
    workflow_dispatch:

permissions:
    contents: read

jobs:
    directories:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
                features:
                    - "native-directories"
                    - "std"
                    - "tokio"
                    - "simulator"
                    - "simulator,std,tokio"
                    - "simulator,simulator-real-fs"
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v6
            - uses: dtolnay/rust-toolchain@stable
              with:
                  components: clippy
            - run: cargo check -p switchy_fs --no-default-features
            - run: cargo clippy -p switchy_fs --all-targets --no-default-features --features "${{ matrix.features }}" -- -D warnings
            - run: cargo test -p switchy_fs --no-default-features --features "${{ matrix.features }}"
