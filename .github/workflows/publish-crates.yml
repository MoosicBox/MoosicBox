name: Publish Crates

on:
    workflow_dispatch:
        inputs:
            packages:
                description: Comma-separated release roots; empty publishes all pending packages
                required: false
                type: string
                default: ""

jobs:
    publish:
        uses: ./.github/workflows/cargo-release-publish.yml
        with:
            packages: ${{ inputs.packages }}
        secrets: inherit
