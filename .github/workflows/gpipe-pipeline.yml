name: gPipe pipeline

on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    pipeline:
        name: MoosicBox native pipeline
        runs-on: ubuntu-latest
        timeout-minutes: 45
        env:
            CARGO_TERM_COLOR: never
            CARGO_BUILD_JOBS: "2"
        steps:
            - uses: actions/checkout@v6
              with:
                  ref: ${{ github.sha }}
                  persist-credentials: false
            - uses: dtolnay/rust-toolchain@stable
              with:
                  components: clippy, rustfmt, llvm-tools-preview
            - uses: taiki-e/install-action@cargo-llvm-cov
            - name: Build pipeline tools
              shell: bash
              run: |
                  set -euo pipefail
                  mkdir -p "$RUNNER_TEMP/gpipe-artifacts"
                  cargo build --locked -p clippier --no-default-features --features native-ci,cargo-workspace,machete,git-diff,transforms-vendored 2>&1 | tee "$RUNNER_TEMP/gpipe-artifacts/clippier-build.log"
                  cargo build --locked -p gpipe --features runtime 2>&1 | tee "$RUNNER_TEMP/gpipe-artifacts/gpipe-build.log"
            - name: Resolve checked-in pipeline
              shell: bash
              env:
                  PIPELINE_REVISION: ${{ github.sha }}
              run: |
                  target/debug/gpipe pipeline plan .gpipe/moosicbox.json \
                    --workspace "$GITHUB_WORKSPACE" \
                    --revision "$PIPELINE_REVISION" --base-revision "$PIPELINE_REVISION" \
                    --clippier "$GITHUB_WORKSPACE/target/debug/clippier" \
                    --output "$RUNNER_TEMP/gpipe-artifacts"
            - name: Run native deployment and verify evidence
              shell: bash
              run: |
                  target/debug/gpipe pipeline run "$RUNNER_TEMP/gpipe-artifacts/prepared.json" \
                    --workspace "$GITHUB_WORKSPACE" \
                    --state "$RUNNER_TEMP/gpipe-state" \
                    --output "$RUNNER_TEMP/gpipe-artifacts"
            - name: Publish pipeline artifacts and failure diagnostics
              if: ${{ always() }}
              uses: actions/upload-artifact@v4
              with:
                  name: gpipe-${{ github.run_id }}-${{ github.run_attempt }}
                  path: ${{ runner.temp }}/gpipe-artifacts/
                  if-no-files-found: warn
                  retention-days: 7
