clear-target-1:
    commands: rm -rf target

clippy:
    commands: |
        {{if matrix.package.env}}{{matrix.package.env}} {{endif}}cargo{{if matrix.package.nightly}} +nightly{{endif}} clippy {{if runner.debug}}-vv {{endif}}--all-targets --no-default-features {{clippier.feature-flags}}{{if matrix.package.cargo}} {{matrix.package.cargo}}{{endif}}
    label: "Clippy"
    strategy: "sequential"

tests:
    commands: |
        {{if matrix.package.env}}{{matrix.package.env}} {{endif}}cargo{{if matrix.package.nightly}} +nightly{{endif}} {{vars.test-command}} {{if runner.debug}}-vv {{endif}}--no-default-features {{clippier.feature-flags}}{{if matrix.package.cargo}} {{matrix.package.cargo}}{{endif}} --no-fail-fast
    label: "Tests"
    strategy: "sequential"

doctests:
    commands: |
        PACKAGE_PATH="{{matrix.package.path}}"
        PACKAGE_PATH="${PACKAGE_PATH#./}"
        if ! cargo metadata --format-version=1 --no-deps | jq -e ".packages[] | select(.manifest_path | contains(\"${PACKAGE_PATH}/Cargo.toml\")) | .targets[] | select(.kind[] | contains(\"lib\"))" > /dev/null 2>&1; then
            echo "Skipping doctests for {{matrix.package.name}} - no library target found"
            exit 0
        fi
        {{if matrix.package.env}}{{matrix.package.env}} {{endif}}cargo{{if matrix.package.nightly}} +nightly{{endif}} test --doc {{if runner.debug}}-vv {{endif}}--no-default-features {{clippier.feature-flags}}{{if matrix.package.cargo}} {{matrix.package.cargo}}{{endif}} --no-fail-fast
    label: "Doctests"
    strategy: "sequential"

coverage:
    # Collect before clear-target-2; each stacked case has its own output file.
    commands: |
        if [[ -n "{{vars.coverage-output}}" ]]; then
            {{if matrix.package.env}}{{matrix.package.env}} {{endif}}bash "$GITHUB_WORKSPACE/.github/clippier/run-matrix/coverage.sh" "{{vars.coverage-output}}" {{if matrix.package.nightly}}+nightly {{endif}}--no-default-features {{clippier.feature-flags}}{{if matrix.package.cargo}} {{matrix.package.cargo}}{{endif}}
        fi
    label: "Coverage"
    strategy: "combined"

clear-target-2:
    commands: rm -rf target

format:
    # Windows cannot spawn rustfmt with the entire workspace's file list.
    # Other runners retain the workspace-wide check.
    commands: |
        if [[ "{{matrix.package.os}}" == windows-latest ]]; then
            cargo{{if matrix.package.nightly}} +nightly{{endif}} fmt --package "{{matrix.package.name}}" -- --check
        else
            cargo{{if matrix.package.nightly}} +nightly{{endif}} fmt --all -- --check
        fi
    label: "Format"
    strategy: "combined"

machete:
    # Native source analysis cannot yet prove every macro/namespace case. Keep
    # those reports INCOMPLETE without failing CI solely for coverage limitations;
    # confirmed unused dependencies and operational errors still fail this check.
    commands: cd "$GITHUB_WORKSPACE" && ~/.cargo/bin/clippier machete check --allow-incomplete --manifest-path "{{matrix.package.path}}/Cargo.toml"
    label: "Clippier machete"
    strategy: "combined"
