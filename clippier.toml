# Per-package overrides preserve broad default analysis while handling packages
# whose published/default feature sets cannot be built together.
[release.semver.packages.hyperchad]
# The published default feature graph cannot build because moosicbox_app_native_image@0.4.0
# omitted its required public/ assets. The heuristic also combines mutually exclusive profilers.
feature-policy = "explicit-only"

# Workspace-level clippier configuration
# This defines common toolchains and dependencies for workspace-level CI setup

# Common toolchains needed for full workspace CI
[[dependencies]]
toolchain = "cargo-machete"

[[dependencies]]
toolchain = "taplo"

[runner]
skip = ["gofmt"]

[runner.scope]
exclude = [
    "/packages/clippier/md/tests/vendor/commonmark-spec/**",
    "/packages/opus_native/libopus/opus/**",
]

[tools.clippier-md]
engine     = "ast"
line-width = 999999

[tools.clippier-md.prose]
wrap = "preserve"

[tools.clippier-md.list]
indentation = "preserve"

[tools.clippier-md.headings]
indentation = "preserve"

[tools.clippier-md.files]
exclude = ["/packages/clippier/md/tests/parity/fixtures/**"]
