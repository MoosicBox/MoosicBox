[[config]]
os   = "windows"
rust = { skip-features = ["asio"] }

[[config.dependencies]]
command = "choco install ffmpeg -y --no-progress"

[[config]]
os = "ubuntu"

[[config.dependencies]]
command = "sudo apt-get update && sudo apt-get install -y ffmpeg"

[[config]]
os = "macos"

[[config.dependencies]]
command = "brew install ffmpeg"
