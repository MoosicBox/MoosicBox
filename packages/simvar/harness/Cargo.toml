[package]
authors     = { workspace = true }
categories  = ["development-tools::testing", "simulation"]
description = "Simulator Harness package"
edition     = { workspace = true }
keywords    = ["deterministic", "harness", "simulator", "test"]
license     = { workspace = true }
name        = "simvar_harness"
readme      = "README.md"
repository  = { workspace = true }
version     = "0.5.0"

[package.metadata]
examples = false

[package.metadata.workspaces]
group = "simvar"

[target.'cfg(unix)'.dependencies]
# Finds the clock probe's functions at run time (`SIMULATOR_CLOCK_READS`).
libc = { workspace = true }

[dependencies]
simvar_observer = { workspace = true }
simvar_ratatui = { workspace = true, optional = true }
simvar_utils = { workspace = true }
switchy = { workspace = true, features = [
    "async",
    "network",
    "random",
    "simulation",
    "simulator",
    "tcp",
    "time",
] }
switchy_web_server = { workspace = true, optional = true }

btparse         = { workspace = true }
color-backtrace = { workspace = true }
ctrlc           = { workspace = true }
log             = { workspace = true }
scoped-tls      = { workspace = true }
shell-words     = { workspace = true }
thiserror       = { workspace = true }

# Logging
pretty_env_logger = { workspace = true, optional = true }

[dev-dependencies]
switchy  = { workspace = true, features = ["async-io"] }
test-log = { workspace = true }

[features]
default = ["pretty_env_logger", "tui"]

fail-on-warnings = [
    "simvar_observer/fail-on-warnings",
    "simvar_ratatui?/fail-on-warnings",
    "simvar_utils/fail-on-warnings",
    "switchy/fail-on-warnings",
    "switchy_web_server?/fail-on-warnings",
]

async = ["switchy/async"]
database = ["switchy/database", "switchy/database-connection"]
fs = ["switchy/fs", "switchy/fs-tokio"]
fs-simulator-real-fs = ["switchy/fs-simulator-real-fs"]
http = ["switchy/http"]
mdns = ["switchy/mdns"]
random = ["switchy/random"]
tcp = ["switchy/tcp"]
telemetry = ["switchy/telemetry"]
thread = ["switchy/thread", "switchy/thread-simulator"]
time = ["switchy/time"]
upnp = ["switchy/upnp"]
web-server = [
    "dep:switchy_web_server",
    "switchy/web-server",
    "switchy_web_server/simulator",
]

tui = ["dep:simvar_ratatui"]
