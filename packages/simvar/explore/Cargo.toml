description = "Model checking for simvar: exhaustive and random-walk state space exploration"
edition     = { workspace = true }
keywords    = ["deterministic", "model-checking", "simulator", "test"]
license     = { workspace = true }
name        = "simvar_explore"
readme      = "README.md"
