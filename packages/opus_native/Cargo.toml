[package]
authors     = { workspace = true }
categories  = ["encoding", "multimedia"]
description = "Pure Rust Opus audio decoder implementation"
edition     = { workspace = true }
keywords    = ["audio", "codec", "decoder", "opus", "rust"]
license     = { workspace = true }
name        = "moosicbox_opus_native"
readme      = "README.md"
repository  = { workspace = true }
version     = "0.4.0"

[package.metadata]
examples = false

[dependencies]
log                                = { workspace = true }
moosicbox_opus_native_test_vectors = { workspace = true, optional = true }
moosicbox_resampler                = { workspace = true, optional = true }
symphonia                          = { workspace = true, optional = true }
thiserror                          = { workspace = true }

[dev-dependencies]
test-case = { workspace = true }
test-log  = { workspace = true }

[[test]]
name              = "integration_tests"
required-features = ["test-vectors"]

[features]
default = ["celt", "hybrid", "silk"]

fail-on-warnings = ["moosicbox_resampler?/fail-on-warnings"]

resampling   = ["dep:moosicbox_resampler", "dep:symphonia"]
test-vectors = ["dep:moosicbox_opus_native_test_vectors"]

_any-decoder = []
celt         = ["_any-decoder"]
hybrid       = ["celt", "silk"]
silk         = ["_any-decoder"]
