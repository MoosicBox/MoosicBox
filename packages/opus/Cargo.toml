[package]
authors     = { workspace = true }
categories  = ["encoding", "multimedia"]
description = "MoosicBox Opus codec decoder implementation for Symphonia"
edition     = { workspace = true }
keywords    = ["audio", "codec", "decoder", "opus", "symphonia"]
license     = { workspace = true }
name        = "moosicbox_opus"
readme      = "README.md"
repository  = { workspace = true }
version     = "0.5.0"

[package.metadata]
examples = false

[dependencies]
audiopus = { workspace = true, optional = true }
bytes = { workspace = true }
log = { workspace = true }
moosicbox_ogg_opus = { workspace = true }
moosicbox_opus_native = { workspace = true, optional = true, features = [
    "celt",
    "hybrid",
    "resampling",
    "silk",
] }
symphonia = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
test-case         = { workspace = true }
test-log          = { workspace = true }

[features]
default          = ["libopus"]
fail-on-warnings = []
libopus          = ["dep:audiopus"]
native           = ["dep:moosicbox_opus_native"]
