[package]
authors     = { workspace = true }
categories  = ["gui"]
description = "HyperChad egui renderer package"
edition     = { workspace = true }
keywords    = ["desktop", "egui", "gui", "render", "renderer"]
license     = { workspace = true }
name        = "hyperchad_renderer_egui"
readme      = "README.md"
repository  = { workspace = true }
version     = "0.5.0"

[package.metadata]
examples = false

[package.metadata.workspaces]
group = "hyperchad"

[dependencies]
hyperchad_actions = { workspace = true, features = ["handler", "logic"] }
hyperchad_color = { workspace = true, features = ["egui"] }
hyperchad_renderer = { workspace = true, features = ["canvas"] }
hyperchad_router = { workspace = true }
hyperchad_transformer = { workspace = true, features = [
    "html",
    "layout-offset",
    "logic",
] }
switchy_async = { workspace = true, features = ["time", "tokio"] }
switchy_http = { workspace = true, features = ["reqwest", "stream"] }

async-trait = { workspace = true }
eframe = { workspace = true, default-features = false, features = [
    "__screenshot",
    "accesskit",
    "default_fonts",
    "web_screen_reader",
] }
# Enable the already-used GPU backend defaults without eframe's renderer/window defaults.
egui-wgpu         = { workspace = true, optional = true }
egui_extras       = { workspace = true, features = ["image", "svg"] }
flume             = { workspace = true }
futures-util      = { workspace = true }
image             = { workspace = true, features = ["png", "webp"] }
log               = { workspace = true }
raw-window-handle = { workspace = true, optional = true, features = ["std"] }
rfd               = { workspace = true, features = ["wayland", "xdg-portal"] }
serde             = { workspace = true, optional = true, features = ["derive"] }
serde_json        = { workspace = true, optional = true }

[features]
default = ["debug", "wayland", "wgpu", "x11"]

fail-on-warnings = [
    "hyperchad_actions/fail-on-warnings",
    "hyperchad_color/fail-on-warnings",
    "hyperchad_renderer/fail-on-warnings",
    "hyperchad_router/fail-on-warnings",
    "hyperchad_transformer/fail-on-warnings",
    "switchy_async/fail-on-warnings",
    "switchy_http/fail-on-warnings",
]

glow = ["eframe/glow"]
wgpu = ["dep:egui-wgpu", "eframe/wgpu", "egui-wgpu/default"]

wayland = ["eframe/wayland"]
x11     = ["eframe/x11"]

profiling = ["hyperchad_transformer/profiling"]
profiling-puffin = [
    "hyperchad_renderer/profiling-puffin",
    "hyperchad_transformer/profiling-puffin",
    "profiling",
]
profiling-tracing = ["profiling"]
profiling-tracy = [
    "hyperchad_renderer/profiling-tracy",
    "hyperchad_transformer/profiling-tracy",
    "profiling",
]

debug    = []
feedback = ["dep:raw-window-handle", "dep:serde", "dep:serde_json"]

[dev-dependencies]
test-log = { workspace = true }

[[test]]
name              = "feedback"
path              = "tests/feedback/main.rs"
required-features = ["feedback"]

[[example]]
name              = "feedback"
path              = "examples/feedback.rs"
required-features = ["feedback"]
