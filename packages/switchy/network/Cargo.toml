[package]
authors     = { workspace = true }
categories  = ["development-tools::testing", "network-programming", "simulation"]
description = "Deterministic simulated network with partitions, latency, loss and node crashes"
edition     = { workspace = true }
keywords    = ["deterministic", "network", "partition", "simulation", "testing"]
license     = { workspace = true }
name        = "switchy_network"
readme      = "README.md"
repository  = { workspace = true }
version     = "0.5.0"

[package.metadata]
examples = false

[package.metadata.workspaces]
group = "switchy"

[dependencies]
switchy_simulation = { workspace = true }
switchy_time       = { workspace = true, features = ["simulator"] }

log       = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
test-log = { workspace = true }

[features]
default = []

fail-on-warnings = [
    "switchy_simulation/fail-on-warnings",
    "switchy_time/fail-on-warnings",
]
