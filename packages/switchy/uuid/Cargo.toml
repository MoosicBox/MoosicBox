[package]
authors     = { workspace = true }
categories  = ["development-tools"]
description = "Switchy UUID package"
edition     = { workspace = true }
keywords    = ["identifier", "uuid"]
license     = { workspace = true }
name        = "switchy_uuid"
readme      = "README.md"
repository  = { workspace = true }
version     = "0.5.0"

[package.metadata]
examples = true

[package.metadata.workspaces]
group = "switchy"

[dependencies]
serde              = { workspace = true, optional = true }
switchy_simulation = { workspace = true, optional = true }
switchy_random     = { workspace = true, optional = true, features = ["rand"] }
uuid               = { workspace = true, optional = true }

[dev-dependencies]
bmux_codec = { workspace = true, features = ["serde", "stable"] }
serde_json = { workspace = true }
test-log = { workspace = true }

[features]
default = ["simulator", "uuid"]

fail-on-warnings = ["switchy_simulation?/fail-on-warnings"]

serde = ["dep:serde", "uuid?/serde"]

simulator = ["dep:switchy_simulation"]
native = ["dep:switchy_random"]
uuid-compat = ["dep:uuid"]
uuid = ["native", "uuid-compat"]
