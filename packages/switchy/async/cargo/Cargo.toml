[package]
authors     = { workspace = true }
categories  = ["asynchronous", "development-tools"]
description = "Cargo async linter package"
edition     = { workspace = true }
keywords    = ["async"]
license     = { workspace = true }
name        = "switchy_async_cargo"
readme      = "README.md"
repository  = { workspace = true }
version     = "0.5.0"

[package.metadata]
examples = false

[dependencies]
clap              = { workspace = true }
pretty_env_logger = { workspace = true }
# Line and column numbers of findings.
proc-macro2 = { workspace = true, features = ["span-locations"] }
syn         = { workspace = true, features = ["full", "parsing", "visit"] }
walkdir     = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }

[features]
default = []

fail-on-warnings = []
