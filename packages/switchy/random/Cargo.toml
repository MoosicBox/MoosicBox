[package]
authors     = { workspace = true }
categories  = ["development-tools"]
description = "Switchy RNG package"
edition     = { workspace = true }
keywords    = ["generator", "number", "random"]
license     = { workspace = true }
name        = "switchy_random"
readme      = "README.md"
repository  = { workspace = true }
version     = "0.5.0"

[package.metadata]
examples = true

[package.metadata.workspaces]
group = "switchy"

[dependencies]
switchy_simulation = { workspace = true, optional = true }

log     = { workspace = true }
rand_08 = { workspace = true, features = ["small_rng", "std", "std_rng"] }

# Simulation builds draw every `getrandom` 0.3/0.4 call from the run's seed (src/getrandom.rs).
[target.'cfg(getrandom_backend = "custom")'.dependencies]
getrandom_04 = { workspace = true, optional = true }

[dev-dependencies]
test-log = { workspace = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(getrandom_backend, values("custom"))'] }

[features]
default = ["rand", "simulator"]

fail-on-warnings = ["switchy_simulation?/fail-on-warnings"]

rand      = []
simulator = ["dep:getrandom_04", "dep:switchy_simulation"]
