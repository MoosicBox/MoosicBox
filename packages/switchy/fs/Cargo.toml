[package]
authors     = { workspace = true }
categories  = ["development-tools", "filesystem"]
description = "Switchy File-system package"
edition     = { workspace = true }
keywords    = ["time"]
license     = { workspace = true }
name        = "switchy_fs"
readme      = "README.md"
repository  = { workspace = true }
version     = "0.5.0"

[package.metadata]
examples = true

[package.metadata.workspaces]
group = "switchy"

[dependencies]
switchy_async = { workspace = true, optional = true, features = [
    "io",
    "rt-multi-thread",
    "sync",
] }
switchy_simulation = { workspace = true, optional = true }

log        = { workspace = true }
scoped-tls = { workspace = true, optional = true }
tempfile   = { workspace = true, optional = true }
tokio      = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true, optional = true }
rustix = { workspace = true, optional = true, features = [
    "fs",
    "process",
    "std",
] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, optional = true, features = [
    "Win32_System_Com",
    "Win32_UI_Shell",
] }

[dev-dependencies]
pretty_assertions  = { workspace = true }
switchy_async      = { workspace = true, features = ["macros"] }
switchy_simulation = { workspace = true }
test-log           = { workspace = true }
tokio              = { workspace = true, features = ["macros", "rt"] }

[target.'cfg(unix)'.dev-dependencies]
rustix = { workspace = true, features = ["fs", "process", "std"] }

[features]
default = ["async", "simulator", "std", "sync", "tokio"]

fail-on-warnings = [
    "switchy_async?/fail-on-warnings",
    "switchy_simulation?/fail-on-warnings",
]

native-directories = ["dep:libc", "dep:windows-sys"]
simulator = [
    "dep:rustix",
    "dep:switchy_simulation",
    "switchy_async?/simulator",
    "sync",
]
simulator-real-fs = [
    "dep:scoped-tls",
    "dep:switchy_async",
    "std",
    "switchy_async/rt-multi-thread",
    "tokio",
]
std = ["dep:rustix", "dep:tempfile", "native-directories", "sync"]
tokio = [
    "async",
    "dep:rustix",
    "dep:tokio",
    "native-directories",
    "switchy_async?/fs",
    "switchy_async?/tokio",
]

async = ["dep:switchy_async", "switchy_async/io"]
sync  = ["switchy_async?/sync"]
