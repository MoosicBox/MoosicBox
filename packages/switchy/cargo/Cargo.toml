[package]
authors     = { workspace = true }
categories  = ["development-tools", "simulation"]
description = "Checks that everything a switchy simulation links runs deterministically under it"
edition     = { workspace = true }
keywords    = ["determinism", "simulation", "switchy"]
license     = { workspace = true }
name        = "switchy_cargo"
readme      = "README.md"
repository  = { workspace = true }
version     = "0.5.0"

[package.metadata]
examples = false

[dependencies]
cargo_metadata = { workspace = true }
clap           = { workspace = true }
# Line numbers of findings.
proc-macro2 = { workspace = true, features = ["span-locations"] }
quote       = { workspace = true }
semver         = { workspace = true, features = ["std"] }
serde          = { workspace = true }
serde_json     = { workspace = true }
syn            = { workspace = true, features = ["full", "parsing", "printing", "visit"] }
toml           = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }

[features]
default = []

fail-on-warnings = []
