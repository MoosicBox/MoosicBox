[package]
authors     = { workspace = true }
categories  = ["date-and-time", "development-tools"]
description = "Switchy Time package"
edition     = { workspace = true }
keywords    = ["time"]
license     = { workspace = true }
name        = "switchy_time"
readme      = "README.md"
repository  = { workspace = true }
version     = "0.5.0"

[package.metadata]
examples = true

[package.metadata.workspaces]
group = "switchy"

[dependencies]
switchy_random     = { workspace = true, optional = true, features = ["rand"] }
switchy_simulation = { workspace = true, optional = true }

chrono = { workspace = true, optional = true }
log    = { workspace = true, optional = true }

[dev-dependencies]
serial_test = { workspace = true }
test-log    = { workspace = true }

[features]
default = ["log", "random", "simulator", "std"]

fail-on-warnings = [
    "switchy_random?/fail-on-warnings",
    "switchy_simulation?/fail-on-warnings",
]

chrono = ["dep:chrono"]
log    = ["dep:log"]
# Draw the simulated clock's random parameters from the run's `switchy_random` generator,
# keeping the sequences of earlier releases. Without it the simulator needs no `rand`.
random    = ["dep:switchy_random", "simulator", "switchy_random?/simulator"]
simulator = ["dep:switchy_simulation"]
std       = []
