[release.semver]
# Defaults to cargo-semver-checks' deterministic upstream heuristic.
# feature-policy = "all"
# features = ["public-api-feature"]
# current-features = []
# baseline-features = []

[[ci-steps]]
toolchain = "free_disk_space"

[[config]]
os = "ubuntu"

[[config.dependencies]]
command  = "sudo apt-get update && sudo apt-get install liblua5.4-dev"
features = ["transforms-system"]

[machete]
# Referenced by generated #[switchy_async::test(real_time)] code in upgrade tests.
ignored      = ["switchy_time"]
ignored-dirs = ["test-resources", "tests/fixtures", "tests/transforms/fixtures"]
