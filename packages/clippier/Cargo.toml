[package]
authors     = { workspace = true }
categories  = ["development-tools"]
description = "MoosicBox clippier package"
edition     = { workspace = true }
keywords    = ["clippier", "util", "utilities", "utils"]
license     = { workspace = true }
name        = "clippier"
readme      = "README.md"
repository  = { workspace = true }
version     = "0.5.0"

[package.metadata]
examples = true
tests    = false

[package.metadata.workspaces]
independent = true

[[bin]]
name              = "clippier"
path              = "src/main.rs"
required-features = []

[dependencies]
clippier_md = { workspace = true, optional = true }
moosicbox_log_runtime = { workspace = true, features = [
    "env-filter",
    "file",
    "layer-ext",
    "log-compat",
] }
switchy_async = { workspace = true, features = [
    "macros",
    "process",
    "sync",
    "tokio",
] }
switchy_fs = { workspace = true, features = [
    "async",
    "simulator-real-fs",
    "std",
    "sync",
    "tokio",
] }
switchy_random = { workspace = true, features = ["rand"] }

anyhow = { workspace = true }
async-trait = { workspace = true }
bmux_keyboard = { workspace = true, optional = true }
bmux_tui = { workspace = true, optional = true, features = ["crossterm"] }
bmux_tui_components = { workspace = true, optional = true, features = [
    "button",
    "checkbox",
    "key-hint-bar",
    "labeled-details",
    "pane",
    "scroll-view",
] }
bmux_tui_runtime = { workspace = true, optional = true, features = [
    "crossterm",
] }
cargo-semver-checks = { workspace = true, optional = true }
cargo_metadata = { workspace = true, optional = true }
chrono = { workspace = true }
clap = { workspace = true }
crossterm = { workspace = true, optional = true }
ctrlc = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
globset = { workspace = true }
ignore = { workspace = true }
itertools = { workspace = true }
log = { workspace = true }
proc-macro2 = { workspace = true, optional = true, features = [
    "span-locations",
] }
quote = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }
regex = { workspace = true }
reqwest = { workspace = true, optional = true, features = ["blocking", "json"] }
semver = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
serde_yaml = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
syn = { workspace = true, optional = true, features = [
    "full",
    "parsing",
    "visit",
] }
tar = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true, features = ["rt", "sync", "time"] }
toml = { workspace = true }
toml_edit = { workspace = true, optional = true, features = [
    "display",
    "parse",
] }
which = { workspace = true, optional = true, features = ["real-sys"] }

git2 = { workspace = true, optional = true }
mlua = { workspace = true, optional = true, features = ["lua54", "serialize"] }

[dev-dependencies]
clippier_test_utilities = { workspace = true, features = ["git-diff"] }
flate2                  = { workspace = true }
insta                   = { workspace = true, features = ["json", "redactions", "yaml"] }
sha2                    = { workspace = true }
# Generated by #[switchy_async::test(real_time)] in upgrade registry tests.
switchy_time = { workspace = true }
tar          = { workspace = true }
tempfile     = { workspace = true }
test-log     = { workspace = true }

[features]
default = [
    "cargo-workspace",
    "check",
    "format",
    "git-diff",
    "machete-verify",
    "md",
    "node-workspace",
    "publish",
    "release",
    "tools-tui",
    "transforms-vendored",
    "upgrade",
    "versioning",
]

machete = [
    "dep:bmux_tui",
    # BMUX disables Crossterm defaults; enable the platform backend directly,
    # including Windows support, even without tools-tui/default features.
    "dep:crossterm",
    "dep:proc-macro2",
    "dep:quote",
    "dep:syn",
    "dep:toml_edit",
]
# Explicit execution-backed verification; ordinary analysis never enables this.
machete-verify = ["dep:sha2", "dep:tempfile", "machete"]
md             = ["dep:clippier_md"]

fail-on-warnings = [
    "clippier_md?/fail-on-warnings",
    "moosicbox_log_runtime/fail-on-warnings",
    "switchy_async/fail-on-warnings",
    "switchy_fs/fail-on-warnings",
    "switchy_random/fail-on-warnings",
]

# Workspace type support
_workspace = []
cargo-workspace = ["_workspace"]
node-workspace = ["_workspace", "dep:serde_yaml"]
publish = [
    "dep:cargo_metadata",
    "dep:flate2",
    "dep:reqwest",
    "dep:tar",
    "switchy_async/net",
    "switchy_async/time",
]
release = [
    "dep:cargo-semver-checks",
    "dep:cargo_metadata",
    "dep:flate2",
    "dep:reqwest",
    "dep:semver",
    "dep:tar",
    "dep:toml_edit",
    "publish",
    "switchy_async/net",
]
upgrade = [
    "dep:cargo_metadata",
    "dep:reqwest",
    "dep:semver",
    "dep:tempfile",
    "dep:toml_edit",
    "switchy_async/net",
    "switchy_async/time",
]
versioning = ["dep:cargo_metadata", "dep:toml_edit"]

_tools = ["dep:rayon", "dep:toml_edit", "dep:which"]
_transforms = []
check = ["_tools"]
format = ["_tools", "dep:cargo_metadata", "dep:git2", "dep:tempfile"]
git-diff = ["dep:git2"]
test-utils = ["switchy_fs/simulator-real-fs"]
tools-tui = [
    "_tools",
    "dep:bmux_keyboard",
    "dep:bmux_tui",
    "dep:bmux_tui_components",
    "dep:bmux_tui_runtime",
    "dep:crossterm",
    "dep:ctrlc",
    "dep:tokio",
]
transforms-system = ["_transforms", "dep:mlua"]
transforms-vendored = ["_transforms", "mlua/vendored"]

# Automatically enable test-utils when running tests
[[test]]
name              = "integration_test"
required-features = ["git-diff", "test-utils"]

[[test]]
name              = "external_deps_test"
required-features = ["git-diff", "test-utils"]

[[test]]
name              = "real_world_test"
required-features = ["git-diff", "test-utils"]

[[test]]
name              = "feature_validator_integration"
required-features = ["test-utils"]

[[test]]
name              = "transforms_tests"
required-features = ["_transforms"]
