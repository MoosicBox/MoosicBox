[package]
authors     = { workspace = true }
categories  = ["development-tools"]
description = "Generic log runtime paths and initialization"
edition     = { workspace = true }
keywords    = ["log", "logging", "tracing"]
license     = { workspace = true }
name        = "moosicbox_log_runtime"
readme      = "README.md"
repository  = { workspace = true }
version     = "0.5.0"

[dependencies]
switchy_fs = { workspace = true, features = ["native-directories"] }

thiserror          = { workspace = true }
time               = { workspace = true, optional = true }
tracing-log        = { workspace = true }
tracing-subscriber = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
tracing  = { workspace = true }

[features]
default          = []
fail-on-warnings = ["switchy_fs/fail-on-warnings"]
simulator        = ["switchy_fs/simulator"]

env-filter = ["init"]
file = ["init"]
init = [
    "dep:time",
    "dep:tracing-subscriber",
    "tracing-subscriber/env-filter",
    "tracing-subscriber/fmt",
    "tracing-subscriber/registry",
    "tracing-subscriber/std",
]
layer-ext = ["init", "tracing-subscriber/registry"]
log-compat = ["init"]
